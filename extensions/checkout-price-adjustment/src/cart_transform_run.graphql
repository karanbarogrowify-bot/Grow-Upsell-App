query CartTransformRunInput {
  cart {
    lines {
      id
      quantity
      cost {
        amountPerQuantity {
          amount
          currencyCode
        }
      }
      merchandise {
        ... on ProductVariant {
          product {
            id
          }
        }
      }
    }
  }

  cartTransform {
    configuration: metafield(
      namespace: "$app"
      key: "checkoutPriceAdjustments"
    ) {
      jsonValue
    }
  }
}
